<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Your interest</title>
    <link rel="stylesheet" href="API.css">
  </head>
  <body>
    <div class="container">
      <h1>Weather Report...</h1>
      <div class="input-container">
        <input type="text" id="city-input" placeholder="Add a new interest ..." />
        <button id="get-weather-btn">Add Task</button>
      </div>
       <div id="weather-info" class="hidden">
        <h2 id="city-name" >city name</h2>
        <p id="temperature" >temprature</p>
        <p id="description" >description</p>
       </div>
    </div>
    <p id="error-message" class="hidden">City not found . Please try again.</p>
    <script src="API.js"></script>
  </body>
</html>
